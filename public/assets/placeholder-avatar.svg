<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34" />
      <stop offset="100%" stop-color="#181820" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2020" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff2020" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24" />

  <!-- Subtle grid lines -->
  <path d="M 0,100 L 400,100 M 0,200 L 400,200 M 0,300 L 400,300" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Red Center Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#glowGrad)" />

  <!-- Head & Shoulder Silhouette -->
  <circle cx="200" cy="150" r="54" fill="url(#avatarGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <path d="M 100,340 C 100,250 140,230 200,230 C 260,230 300,250 300,340 Z" fill="url(#avatarGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Tech Accent Ring -->
  <circle cx="200" cy="150" r="68" stroke="rgba(255, 106, 0, 0.4)" stroke-width="1.5" fill="none" stroke-dasharray="8,6" />

  <!-- Minimal Icon Emblem -->
  <path d="M 190,140 L 200,125 L 210,140 L 200,155 Z" fill="#ff6a00" opacity="0.8" />
</svg>
