<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- 3D Slat Cylinder Gradients across width (Left to Right transition) -->

    <!-- Slat 0: Dim Left Slat -->
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="30%" stop-color="#aa2200" />
      <stop offset="85%" stop-color="#440000" />
      <stop offset="100%" stop-color="#0a0000" />
    </linearGradient>

    <!-- Slat 1 -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="25%" stop-color="#cc3300" />
      <stop offset="80%" stop-color="#660000" />
      <stop offset="100%" stop-color="#110000" />
    </linearGradient>

    <!-- Slat 2 -->
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbb00" />
      <stop offset="25%" stop-color="#ee4400" />
      <stop offset="80%" stop-color="#880000" />
      <stop offset="100%" stop-color="#150000" />
    </linearGradient>

    <!-- Slat 3: Glowing Bright Orange -->
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffdd00" />
      <stop offset="20%" stop-color="#ff5500" />
      <stop offset="75%" stop-color="#aa0000" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>

    <!-- Slat 4: Peak Warm Gold/Orange -->
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffee00" />
      <stop offset="20%" stop-color="#ff6600" />
      <stop offset="75%" stop-color="#bb0000" />
      <stop offset="100%" stop-color="#200000" />
    </linearGradient>

    <!-- Slat 5: Peak Brightness -->
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffff22" />
      <stop offset="20%" stop-color="#ff7700" />
      <stop offset="75%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#220000" />
    </linearGradient>

    <!-- Slat 6: Vibrant Orange -->
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffdd00" />
      <stop offset="20%" stop-color="#ff5500" />
      <stop offset="75%" stop-color="#bb0000" />
      <stop offset="100%" stop-color="#1e0000" />
    </linearGradient>

    <!-- Slat 7: Transition to Red-Orange -->
    <linearGradient id="g7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="22%" stop-color="#ff3300" />
      <stop offset="75%" stop-color="#aa0000" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>

    <!-- Slat 8: Bright Red -->
    <linearGradient id="g8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="22%" stop-color="#ee1100" />
      <stop offset="75%" stop-color="#990000" />
      <stop offset="100%" stop-color="#180000" />
    </linearGradient>

    <!-- Slat 9: Intense Red -->
    <linearGradient id="g9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5500" />
      <stop offset="25%" stop-color="#dd0000" />
      <stop offset="75%" stop-color="#880000" />
      <stop offset="100%" stop-color="#150000" />
    </linearGradient>

    <!-- Slat 10: Deep Red -->
    <linearGradient id="g10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3300" />
      <stop offset="25%" stop-color="#cc0000" />
      <stop offset="75%" stop-color="#770000" />
      <stop offset="100%" stop-color="#120000" />
    </linearGradient>

    <!-- Slat 11 -->
    <linearGradient id="g11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ee2200" />
      <stop offset="25%" stop-color="#bb0000" />
      <stop offset="75%" stop-color="#660000" />
      <stop offset="100%" stop-color="#100000" />
    </linearGradient>

    <!-- Slat 12 -->
    <linearGradient id="g12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dd1100" />
      <stop offset="25%" stop-color="#aa0000" />
      <stop offset="75%" stop-color="#550000" />
      <stop offset="100%" stop-color="#0e0000" />
    </linearGradient>

    <!-- Slat 13 -->
    <linearGradient id="g13" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc0000" />
      <stop offset="25%" stop-color="#990000" />
      <stop offset="75%" stop-color="#440000" />
      <stop offset="100%" stop-color="#0c0000" />
    </linearGradient>

    <!-- Slat 14 -->
    <linearGradient id="g14" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb0000" />
      <stop offset="25%" stop-color="#880000" />
      <stop offset="75%" stop-color="#380000" />
      <stop offset="100%" stop-color="#0a0000" />
    </linearGradient>

    <!-- Slat 15 -->
    <linearGradient id="g15" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aa0000" />
      <stop offset="25%" stop-color="#770000" />
      <stop offset="75%" stop-color="#300000" />
      <stop offset="100%" stop-color="#080000" />
    </linearGradient>

    <!-- Slat 16 -->
    <linearGradient id="g16" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#990000" />
      <stop offset="25%" stop-color="#660000" />
      <stop offset="75%" stop-color="#280000" />
      <stop offset="100%" stop-color="#060000" />
    </linearGradient>

    <!-- Slat 17 -->
    <linearGradient id="g17" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#880000" />
      <stop offset="25%" stop-color="#550000" />
      <stop offset="75%" stop-color="#200000" />
      <stop offset="100%" stop-color="#040000" />
    </linearGradient>

    <!-- Slat 18 -->
    <linearGradient id="g18" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#770000" />
      <stop offset="25%" stop-color="#440000" />
      <stop offset="75%" stop-color="#180000" />
      <stop offset="100%" stop-color="#020000" />
    </linearGradient>

    <!-- Slat 19 -->
    <linearGradient id="g19" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#550000" />
      <stop offset="25%" stop-color="#330000" />
      <stop offset="75%" stop-color="#100000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Top & Bottom Vignette Mask to produce the curved lighting height arc -->
    <linearGradient id="vertVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="15%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>

    <!-- Curved Arc Radial Glow Overlay -->
    <radialGradient id="centerArcGlow" cx="28%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffee66" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ff5500" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#aa0000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Pitch Black Base Container -->
  <rect width="1000" height="600" fill="#000000" />

  <!-- 20 Vertical Slats Grid -->
  <rect x="5" y="0" width="42" height="600" fill="url(#g0)" />
  <rect x="55" y="0" width="42" height="600" fill="url(#g1)" />
  <rect x="105" y="0" width="42" height="600" fill="url(#g2)" />
  <rect x="155" y="0" width="42" height="600" fill="url(#g3)" />
  <rect x="205" y="0" width="42" height="600" fill="url(#g4)" />
  <rect x="255" y="0" width="42" height="600" fill="url(#g5)" />
  <rect x="305" y="0" width="42" height="600" fill="url(#g6)" />
  <rect x="355" y="0" width="42" height="600" fill="url(#g7)" />
  <rect x="405" y="0" width="42" height="600" fill="url(#g8)" />
  <rect x="455" y="0" width="42" height="600" fill="url(#g9)" />
  <rect x="505" y="0" width="42" height="600" fill="url(#g10)" />
  <rect x="555" y="0" width="42" height="600" fill="url(#g11)" />
  <rect x="605" y="0" width="42" height="600" fill="url(#g12)" />
  <rect x="655" y="0" width="42" height="600" fill="url(#g13)" />
  <rect x="705" y="0" width="42" height="600" fill="url(#g14)" />
  <rect x="755" y="0" width="42" height="600" fill="url(#g15)" />
  <rect x="805" y="0" width="42" height="600" fill="url(#g16)" />
  <rect x="855" y="0" width="42" height="600" fill="url(#g17)" />
  <rect x="905" y="0" width="42" height="600" fill="url(#g18)" />
  <rect x="955" y="0" width="40" height="600" fill="url(#g19)" />

  <!-- Curved Light Arc Blend -->
  <rect width="1000" height="600" fill="url(#centerArcGlow)" />

  <!-- Top & Bottom Curved Vignette -->
  <rect width="1000" height="600" fill="url(#vertVignette)" />
</svg>
